<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap-grid.min.css">
 <style>
    .cell {
      height: 100px;
      border: 2px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: bold;
      cursor: pointer;
      background-color: #f8f9fa;
    }

    .cell:hover {
      background-color: #e9ecef;
    }

    .game-board {
      max-width: 350px;
      margin: 0 auto;
    }
  </style>

</head>
<body>

 <div class="container mt-5">
    <h1 id="turn-tracker" class="text-center mb-4">X's Turn</h1>
    
    <div class="container game-board">
      <div class="row">
        <div class="col-4 cell" data-index="0"></div>
        <div class="col-4 cell" data-index="1"></div>
        <div class="col-4 cell" data-index="2"></div>
      </div>
      <div class="row">
        <div class="col-4 cell" data-index="3"></div>
        <div class="col-4 cell" data-index="4"></div>
        <div class="col-4 cell" data-index="5"></div>
      </div>
      <div class="row">
        <div class="col-4 cell" data-index="6"></div>
        <div class="col-4 cell" data-index="7"></div>
        <div class="col-4 cell" data-index="8"></div>
      </div>
    </div>
    
    <button id="reset-btn" class="btn btn-primary mt-4 d-block mx-auto">Reset Game</button>
  </div>
<script src="node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
<script src="node_modules/jquery/dist/jquery.js"></script>
<script src="tictactoe.js"></script>
</body>
</html>
